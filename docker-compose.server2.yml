version: '3.8'

networks:
  conecta_net:
    driver: bridge
    name: conecta_net

services:
  # -------------------------------------------------------------
  # Servidor 2 (WebRTC & Midia):
  # Microsservico Python FastAPI (webrtc_service) e Coturn STUN/TURN
  # (portas UDP 3478, 5349, 49152-65535).
  # Totalmente desacoplado: Sem banco de dados relacional, manipulando
  # apenas estado efemero de chamadas e validacao stateless de JWT.
  # -------------------------------------------------------------

  # 1. Python 3.12 FastAPI (Microsservico de Sinalizacao WebRTC)
  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: conecta_python
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./webrtc_service:/app
    environment:
      REDIS_URL: "${REDIS_URL:-redis://server1:6379/0}"
      LARAVEL_WEBHOOK_URL: "${LARAVEL_WEBHOOK_URL:-http://server1/api/webhooks/webrtc}"
      WEBHOOK_SECRET: "${WEBRTC_WEBHOOK_SECRET:-sejus_webrtc_webhook_secret_2026}"
      JWT_SECRET_KEY: "${WEBRTC_JWT_SECRET:-sejus_jwt_shared_secret_2026}"
      JWT_SECRET: "${WEBRTC_JWT_SECRET:-sejus_jwt_shared_secret_2026}"
      COTURN_HOST: "${COTURN_HOST:-coturn}"
      COTURN_PORT: "${COTURN_PORT:-3478}"
      COTURN_SECRET: "${COTURN_SECRET:-sejus_turn_secret_key_2026}"
      COTURN_REALM: "${COTURN_REALM:-sejus.es.gov.br}"
      ENVIRONMENT: "${APP_ENV:-production}"
    ports:
      - "8001:8001"
    networks:
      - conecta_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 2. Coturn STUN/TURN Server (Mobile NAT Traversal 3G/4G/5G no ES)
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: conecta_coturn
    restart: unless-stopped
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    networks:
      - conecta_net
    command: ["-c", "/etc/coturn/turnserver.conf"]
