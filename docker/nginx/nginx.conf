# ==============================================================================
# CONECTA EGRESSO (SEJUS/ES) - Nginx Reverse Proxy Configuration
# ==============================================================================

upstream php_upstream {
    server php:9000;
}

upstream python_upstream {
    server python:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost conectaegresso.es.gov.br *.es.gov.br;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # Limite de upload para relatorios, fotos de egressos e documentos
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Cabecalhos de Seguranca Institucional (Governo ES / LGPD)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # Compressao Gzip para otimizacao de banda movel 3G/4G/5G
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Health check endpoint do Nginx
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Roteamento WebSockets e Microsservico de Telemetria Python FastAPI
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://python_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts estendidos para chamadas de video ininterruptas
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    location /webrtc-api/ {
        rewrite ^/webrtc-api/(.*)$ /$1 break;
        proxy_pass http://python_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Cache de Arquivos Estaticos do Frontend (Vite / Inertia.js / Imagens)
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Roteamento Principal da Aplicacao Laravel 11 / Inertia.js
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Tratamento de FastCGI PHP 8.3
    location ~ \.php$ {
        fastcgi_pass php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouts para geracao assincrona de relatorios Dompdf pesados
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Bloqueio de arquivos ocultos e sensiveis (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
