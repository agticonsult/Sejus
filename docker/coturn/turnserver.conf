# ==============================================================================
# CONECTA EGRESSO (SEJUS/ES) - Coturn STUN/TURN Configuration
# Traversal de CGNAT e Redes Moveis 3G/4G/5G no Estado do Espirito Santo
# ==============================================================================

# Portas padrao STUN/TURN
listening-port=3478
tls-listening-port=5349

# Faixa de portas dinamicas para encaminhamento UDP de audio e video
min-port=49152
max-port=49200

# Realm governamental oficial
realm=sejus.es.gov.br
server-name=coturn.sejus.es.gov.br

# Mecanismo de credenciais de longa duracao e secret efemero (REST API HMAC)
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=sejus_turn_secret_key_2026

# Usuario estatico para contingencia e testes de ambiente
user=conecta_user:conecta_turn_pass_2026

# Suporte avancado a MICE (Mobile ICE Handover entre 4G e Wi-Fi)
mobility

# Politicas de cota e performance
total-quota=200
max-bps=0
stale-nonce=600

# Isolamento e seguranca
no-multicast-peers
no-cli
no-loopback-peers
no-tcp-relay

# Logs
log-file=stdout
verbose
